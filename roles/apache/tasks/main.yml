---
# tasks file for apache

- name: Install apache
  ansible.builtin.dnf:
    name: "{{ apache_pkg }}"
    state: latest

- name: Start and enable {{ apache_svc }}
  ansible.builtin.systemd:
    name: "{{ apache_svc }}"
    state: started
    enabled: true  

- name: Index.html is in place 
  ansible.builtin.template:
    src: template.j2
    dest: /var/www/html/index.html

- name: Open the firewall port for apache
  ansible.posix.firewalld:
    service: http
    permanent: yes
    state: enabled
    immediate: yes

