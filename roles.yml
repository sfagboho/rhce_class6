---
- name: Run the php role
  hosts: dev
  become: true
  roles:
    - role: phpinfo
  

- name: Run the balancer role
  hosts: balancer
  become: true
  roles:
    - role: balancer
      vars: 
        haproxy_backend_servers:
          - name: node2
            address: 192.168.1.81:80
          - name: node3
            address: 192.168.1.82:80
  tags: balancer
